<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="{{ project_title }} — personalized notes, adaptive quizzes, study plans and progress tracking.">
  {% block meta %}{% endblock %}
  <title>{% block title %}{{ app_name }}{% endblock %} · {{ app_name }}</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("lfTheme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) { /* storage unavailable */ }
    })();
  </script>
  <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}?v=2.4" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "layouts/_flash.html" %}
  {% block body %}{% endblock %}

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=2.4"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
